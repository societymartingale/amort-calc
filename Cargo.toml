[package]
name = "amort-calc"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = {version = "0.4.45", features = ["serde"]}
leptos = { version = "0.8.19", features = ["csr", "nightly"] }
leptos_router = { version = "0.8.13", features = ["nightly"] }
rust_decimal = { version = "1.42.1", features = ["maths"] }
serde = "1.0.228"
serde_json = "1.0.150"
thousands = "0.2.0"
urlencoding = "2.1.3"
