[package]
name = "amort-calc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
rust_decimal = { version = "1.43.0", features = ["maths"] }
serde = "1.0.229"
serde_json = "1.0.154"
thousands = "0.2.0"
urlencoding = "2.1.3"
