<!DOCTYPE html>
<html>
  <head>
    <link data-trunk rel="rust" data-bin="amort-calc" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="favicon.ico" />
    <link data-trunk rel="copy-file" href="_redirects" />
    <link data-trunk rel="copy-file" href="_headers" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <title>Loan Amortization</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a stored explicit theme before first paint (no flash).
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: white;
        --text: black;
        --muted: gray;
        --border: lightgray;
        --border-strong: black;
        --accent: turquoise;
        --accent-text: black;
        --separator: turquoise;
        --th-bg: var(--accent);
        --th-text: black;
        --stripe: transparent;
        --highlight-bg: lightyellow;
        --highlight-text: inherit;
        --error: #b00020;
        --link: inherit;
        --btn-bg: white;
        --btn-text: black;
        --btn-border: black;
        --input-bg: Field;
        --input-text: FieldText;
        --input-border: #767676;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      /* Dark palette: shared by the OS preference (when no explicit choice) and data-theme=dark */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #16191d;
          --text: #e6e8eb;
          --muted: #a0a7b0;
          --border: #3a414a;
          --border-strong: #5c6570;
          --accent: #40e0d0;
          --accent-text: #0b1f1d;
          --separator: #2bb3a6;
          --th-text: #0b1f1d;
          --stripe: #1d2126;
          --highlight-bg: #3d3a1c;
          --highlight-text: #fff4b8;
          --error: #ff8a80;
          --link: #5eead4;
          --btn-bg: #23282e;
          --btn-text: #e6e8eb;
          --btn-border: #5c6570;
          --input-bg: #23282e;
          --input-text: #e6e8eb;
          --input-border: #5c6570;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #16191d;
        --text: #e6e8eb;
        --muted: #a0a7b0;
        --border: #3a414a;
        --border-strong: #5c6570;
        --accent: #40e0d0;
        --accent-text: #0b1f1d;
        --separator: #2bb3a6;
        --th-text: #0b1f1d;
        --stripe: #1d2126;
        --highlight-bg: #3d3a1c;
        --highlight-text: #fff4b8;
        --error: #ff8a80;
        --link: #5eead4;
        --btn-bg: #23282e;
        --btn-text: #e6e8eb;
        --btn-border: #5c6570;
        --input-bg: #23282e;
        --input-text: #e6e8eb;
        --input-border: #5c6570;
      }

      body {
        background: var(--bg);
        color: var(--text);
      }

      /* Only restyle inputs in dark so light keeps native look */
      :root[data-theme="dark"] input {
        background: var(--input-bg);
        color: var(--input-text);
        border: 1px solid var(--input-border);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) input {
          background: var(--input-bg);
          color: var(--input-text);
          border: 1px solid var(--input-border);
        }
      }

      tbody tr:nth-child(even) td {
        background: var(--stripe);
      }

      .theme-toggle {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 2;
        width: 36px;
        height: 36px;
        font-size: 18px;
        line-height: 1;
        border: 1px solid var(--btn-border);
        border-radius: 50%;
        background: var(--btn-bg);
        color: var(--btn-text);
        cursor: pointer;
      }
      .theme-toggle:focus-visible,
      .toggle button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .app {
        font-family: sans-serif;
        padding: 32px;
      }

      form {
        display: grid;
        grid-template-columns: max-content max-content;
        column-gap: 12px;
        row-gap: 8px;
        align-items: center;
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--separator);
      }

      p {
        padding-bottom: 16px;
      }

      label {
        color: var(--text);
        font-weight: bold;
      }

      input {
        justify-self: start;
      }

      table {
        border-collapse: collapse;
      }

      th {
        padding: 10px;
        text-align: center;
        background-color: var(--th-bg);
        color: var(--th-text);
        border: 1px solid var(--border-strong);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      td {
        padding: 6px;
        text-align: left;
        border: 1px solid var(--border);
      }

      .error {
        color: var(--error);
        font-weight: bold;
      }

      .version {
        margin-top: 24px;
        font-size: 12px;
        color: var(--muted);
      }

      .version a {
        color: var(--link);
      }

      .highlight {
        background: var(--highlight-bg);
        color: var(--highlight-text);
        padding: 2px;
      }
      .summary {
        display: grid;
        grid-template-columns: max-content max-content;
        column-gap: 12px;
        row-gap: 8px;
        padding-bottom: 16px;
      }

      .summary .label {
        font-weight: bold;
      }

      .toggle {
        padding-bottom: 12px;
      }

      .toggle button {
        padding: 6px 14px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--btn-text);
        cursor: pointer;
      }

      .toggle button.active {
        background-color: var(--accent);
        color: var(--accent-text);
        font-weight: bold;
      }
    </style>
  </head>
  <body></body>
</html>
