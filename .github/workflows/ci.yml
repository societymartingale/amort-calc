name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins stable + rustfmt, clippy and the wasm32 target
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (wasm32)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (host)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Install Trunk
        run: curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C ~/.cargo/bin
      - name: Build site
        env:
          APP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --tags --quiet origin || true
          export APP_BUILD_TAG="$(git tag --points-at "$APP_BUILD_SHA" | sort -V | tail -n1)"
          echo "Building $APP_BUILD_SHA ${APP_BUILD_TAG:-(untagged)}"
          trunk build --release --locked
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://amort-calc.pages.dev
    permissions:
      contents: read
    concurrency:
      group: cloudflare-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amort-calc --branch=main

  preview:
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: cloudflare-pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=amort-calc --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}
      - name: Post sticky preview comment
        uses: actions/github-script@v8
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const { ALIAS_URL, DEPLOY_URL, HEAD_SHA } = process.env;
            const body = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `| | |`,
              `|---|---|`,
              `| Branch preview | ${ALIAS_URL || '_(no alias returned)_'} |`,
              `| This commit | ${DEPLOY_URL} |`,
              `| Commit | \`${HEAD_SHA.slice(0, 7)}\` |`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
